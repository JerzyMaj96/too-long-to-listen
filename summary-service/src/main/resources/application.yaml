spring:
  application:
    name: summary-service
  profiles:
    active: dev
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
logging:
  level:
    root: INFO
    com.jerzymaj.summaryservice: DEBUG
server:
  port: 8082

---
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5435/summary_db
    username: ${DB_USERNAME_SUM}
    password: ${DB_PASSWORD_SUM}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: summary-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.jerzymaj.summaryservice.event.TranscriptCompletedEvent
